<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IR Remote Protocols - EcoTrack Aircon IoT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css?v=54">
  <script src="./js/supabase.umd.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/hardware-cloud.js?v=5"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/sidebar-loader.js?v=7"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/eco-network.js"></script>
  <script src="./js/eco-data-bus.js"></script>
  <script src="./js/skeletons.js"></script>
  <script src="./js/aircon-system.js?v=14"></script>
</head>

<body class="app-shell bg-gray-50 dark:bg-[#0a0f1d] text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div class="flex h-screen">
    <!-- Sidebar injected by sidebar-loader.js -->

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- HEADER -->
      <header class="bg-white dark:bg-[#0c1328] border-b border-gray-200 dark:border-white/5 px-6 py-3.5 flex justify-between items-center z-10 shadow-sm flex-shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4.93 4.93a10 10 0 0 1 14.14 0" />
              <path d="M7.76 7.76a6 6 0 0 1 8.48 0" />
              <circle cx="12" cy="12" r="2" />
              <path d="M7.76 16.24a6 6 0 0 0 8.48 0" />
              <path d="M4.93 19.07a10 10 0 0 0 14.14 0" />
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-extrabold text-[#18392B] dark:text-white tracking-tight">IR Remote Protocols</h1>
            <p class="text-[11px] font-medium text-gray-500 dark:text-gray-400">Dynamic full-state generation &bull; Standard Climate IR libraries (ESPHome / IRremoteESP8266)</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="ir-library.html" class="btn-gradient-submit px-4 py-2 rounded-xl text-white font-bold text-xs flex items-center gap-2 shadow-sm transition-all hover:scale-105" style="color: #ffffff !important;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" style="stroke: #ffffff !important;">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
            </svg>
            <span style="color: #ffffff !important;">Protocol Setup Wizard</span>
          </a>
        </div>
      </header>

      <!-- PROFILES GRID -->
      <div class="flex-1 overflow-auto p-6 space-y-6">
        <!-- Toast Notification Area -->
        <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

        <div id="profilesCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 max-w-6xl mx-auto">
          <!-- Injected dynamically -->
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('profilesCardsContainer');
      const { AirconProfileManager, CapabilityEngine, ProtocolAdapter, CommandManager, AirconEvents, NodeService } = window.EcoTrackAirconSystem || {};

      function showToast(message, type = 'success') {
        const toastContainer = document.getElementById('toastContainer');
        if (!toastContainer) return;
        const toast = document.createElement('div');
        const isSuccess = type === 'success';
        toast.className = `px-4 py-3 rounded-xl shadow-lg border text-xs font-bold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2.5 ${
          isSuccess 
            ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 backdrop-blur-md' 
            : 'bg-rose-950/90 text-rose-200 border-rose-500/40 backdrop-blur-md'
        }`;
        toast.innerHTML = `
          <span>${isSuccess ? '⚡' : '⚠️'}</span>
          <span>${message}</span>
        `;
        toastContainer.appendChild(toast);
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });
        setTimeout(() => {
          toast.classList.add('translate-y-2', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      // Predefined protocol catalog from CapabilityEngine
      const supportedProtocols = CapabilityEngine?.getSupportedProtocols?.() || [
        { protocol_name: 'midea_ir', label: 'Midea / Carrier / Comfee (climate_ir: midea)' },
        { protocol_name: 'gree', label: 'Gree Electric / Tosot (climate_ir: gree)' },
        { protocol_name: 'daikin', label: 'Daikin ARC433 / ARC4xx (climate_ir: daikin)' },
        { protocol_name: 'carrier', label: 'Carrier Inverter / Optima (climate_ir: carrier)' },
        { protocol_name: 'panasonic', label: 'Panasonic CS Series (climate_ir: panasonic)' },
        { protocol_name: 'koppel_ir', label: 'Koppel Split / Window (climate_ir: koppel)' },
        { protocol_name: 'mitsubishi', label: 'Mitsubishi Heavy / Electric (climate_ir: mitsubishi)' },
        { protocol_name: 'samsung', label: 'Samsung WindFree / Digital (climate_ir: samsung)' },
        { protocol_name: 'generic_ac', label: 'Universal Generic AC (climate_ir: generic)' }
      ];

      function renderProfiles() {
        if (!AirconProfileManager || !container) return;
        const aircons = AirconProfileManager.getAll();
        
        container.classList.add('eco-content-fade-in');
        container.innerHTML = '';

        if (!aircons || aircons.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-16 text-center">
              <div class="w-12 h-12 rounded-2xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center mx-auto mb-3 text-teal-400">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="9" rx="2"/></svg>
              </div>
              <h4 class="text-sm font-bold text-slate-800 dark:text-gray-200">No Aircon Profiles Found</h4>
              <p class="text-xs text-slate-500 dark:text-gray-400 mt-1">Register aircon units in the Nodes / Aircons dashboard to manage protocol adapters.</p>
            </div>
          `;
          return;
        }

        aircons.forEach(ac => {
          const currentProto = ac.protocol_name || ac.protocol || CapabilityEngine.resolveProtocolName(ac);
          const protocolOptions = supportedProtocols.some(p => p.protocol_name === currentProto) ? supportedProtocols :
            [...supportedProtocols, { protocol_name: currentProto, label: `Captured ${currentProto}` }];
          const caps = CapabilityEngine.getCapabilities(currentProto);
          const node = NodeService?.getNode(ac.node_id);
          const hasNode = Boolean(ac.node_id && node);
          const isNodeOnline = hasNode ? (node.status?.toLowerCase() === 'connected' || node.status?.toLowerCase() === 'online') : false;

          const card = document.createElement('div');
          card.className = 'bg-white dark:bg-[#0c1328]/90 dark:backdrop-blur-md rounded-2xl p-5 sm:p-6 border border-slate-200/90 dark:border-white/10 flex flex-col justify-between shadow-xs hover:shadow-md hover:border-teal-500/40 transition-all';
          card.id = `card_${ac.device_id}`;

          // Clean duplicate device IDs from display name (e.g. "Unassigned AC (AC-esp32s3-...)" -> "Unassigned AC")
          const rawName = ac.name || 'AC Unit';
          const cleanName = rawName.replace(/\s*\([^)]*AC-[^)]*\)/gi, '').trim() || rawName;

          card.innerHTML = `
            <div>
              <!-- UNIT HEADER -->
              <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 border-b border-slate-200/80 dark:border-white/10 pb-4 mb-4">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <h3 class="text-base font-extrabold text-slate-900 dark:text-white tracking-tight truncate">${cleanName}</h3>
                  </div>
                  <div class="flex items-center gap-2 mt-1 text-xs text-slate-500 dark:text-gray-400 flex-wrap">
                    <span class="font-medium">${ac.brand || 'Unspecified'}</span>
                    <span class="text-slate-300 dark:text-white/20">&bull;</span>
                    <span class="font-medium">${ac.model || ac.aircon_type || 'Split Type (Inverter)'}</span>
                    <span class="text-slate-300 dark:text-white/20">&bull;</span>
                    <span class="inline-flex items-center gap-1">
                      <span class="text-[11px] text-slate-400">Node:</span>
                      <span class="font-mono font-semibold text-teal-600 dark:text-teal-400 text-[11px]">${ac.node_id || 'Unassigned'}</span>
                    </span>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0 flex-wrap sm:flex-nowrap">
                  <span class="px-2.5 py-1 rounded-lg text-[11px] font-mono font-semibold bg-slate-100 dark:bg-white/5 text-slate-700 dark:text-cyan-300 border border-slate-200 dark:border-white/10 whitespace-nowrap shadow-2xs">
                    ${ac.device_id}
                  </span>
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${
                    !hasNode
                      ? 'bg-slate-100 text-slate-600 border border-slate-200 dark:bg-white/5 dark:text-gray-400 dark:border-white/10'
                      : isNodeOnline 
                        ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/80 dark:bg-emerald-500/10 dark:text-emerald-300 dark:border-emerald-500/30' 
                        : 'bg-rose-50 text-rose-700 border border-rose-200/80 dark:bg-rose-500/10 dark:text-rose-300 dark:border-rose-500/30'
                  }">
                    <span class="w-2 h-2 rounded-full ${!hasNode ? 'bg-slate-400' : isNodeOnline ? 'bg-emerald-500 shadow-sm shadow-emerald-500/50 animate-pulse' : 'bg-rose-500'}"></span>
                    ${!hasNode ? 'No Controller' : isNodeOnline ? 'Node Online' : 'Node Offline'}
                  </span>
                </div>
              </div>

              <!-- PROTOCOL SELECTION & AUTO-DETECT ROW -->
              <div class="space-y-2.5 mb-4">
                <div class="flex items-center justify-between">
                  <label class="text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-gray-300 flex items-center gap-1.5">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" class="text-teal-500">
                      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                      <line x1="4" y1="22" x2="4" y2="15"/>
                    </svg>
                    Active Climate Protocol:
                  </label>
                  <button 
                    type="button"
                    class="btn-autodetect px-2.5 py-1 rounded-lg bg-teal-50 hover:bg-teal-100 dark:bg-teal-500/15 dark:hover:bg-teal-500/25 text-teal-800 dark:text-teal-200 border border-teal-200 dark:border-teal-500/30 font-bold text-[11px] flex items-center gap-1.5 transition-all shadow-2xs hover:shadow-xs cursor-pointer active:scale-95"
                    data-device="${ac.device_id}"
                    data-node="${ac.node_id}"
                    title="Sniff physical remote signal with target node receiver"
                  >
                    <svg class="sniff-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
                      <path d="M4.93 4.93a10 10 0 0 1 14.14 0" />
                      <circle cx="12" cy="12" r="2" />
                      <path d="M7.76 16.24a6 6 0 0 0 8.48 0" />
                    </svg>
                    <svg class="sniff-spinner hidden animate-spin" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                      <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                      <path d="M12 2a10 10 0 0 1 10 10" />
                    </svg>
                    <span class="sniff-label">Auto-Detect via Remote</span>
                  </button>
                </div>

                <div class="relative">
                  <select 
                    class="protocol-dropdown w-full pl-3.5 pr-10 py-2.5 rounded-xl bg-slate-50 dark:bg-black/30 border border-slate-300 dark:border-white/15 text-slate-900 dark:text-white font-bold text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 appearance-none transition-all cursor-pointer shadow-2xs"
                    data-device="${ac.device_id}"
                  >
                    ${protocolOptions.map(p => `
                      <option value="${p.protocol_name}" ${p.protocol_name === currentProto ? 'selected' : ''}>
                        ${p.label || p.protocol_name}
                      </option>
                    `).join('')}
                  </select>
                  <div class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-400">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- DYNAMIC CAPABILITY TAGS (DERIVED FROM CAPABILITY ENGINE) -->
              <div class="mb-4">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-gray-400 block mb-2">
                  Dynamic Capabilities & Brand Limits:
                </span>
                <div class="capability-tags-container space-y-1.5" id="caps_${ac.device_id}">
                  <!-- Injected by renderCapabilityTags -->
                </div>
              </div>
            </div>

            <!-- FOOTER ACTIONS -->
            <div class="pt-3.5 mt-2 border-t border-slate-200/80 dark:border-white/10 space-y-2.5">
              <!-- Top row: Status Badge -->
              <div class="flex items-center justify-between gap-2 text-xs">
                <div class="inline-flex items-center gap-1.5 text-[11px] font-mono text-slate-500 dark:text-gray-400 bg-slate-100/90 dark:bg-white/5 px-2.5 py-1 rounded-lg border border-slate-200/70 dark:border-white/5 whitespace-nowrap shrink-0 shadow-2xs">
                  <span class="w-1.5 h-1.5 rounded-full bg-teal-500 shadow-sm shadow-teal-500/50 animate-pulse"></span>
                  <span>Full-State Climate JSON</span>
                </div>
              </div>

              <!-- Bottom row: Balanced Action Buttons (50/50) -->
              <div class="grid grid-cols-2 gap-2">
                <button 
                  type="button"
                  class="btn-test-intent w-full py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10 text-slate-700 dark:text-gray-200 border border-slate-200 dark:border-white/10 font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-2xs hover:shadow-xs cursor-pointer active:scale-95"
                  data-device="${ac.device_id}"
                  title="Send structured intent payload to node"
                >
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  <span>Test Intent</span>
                </button>
                <button 
                  type="button"
                  class="btn-save-protocol w-full py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm shadow-teal-600/30 hover:shadow-md hover:shadow-teal-600/40 cursor-pointer border-0 active:scale-95"
                  data-device="${ac.device_id}"
                >
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                  <span>Save Protocol</span>
                </button>
              </div>
            </div>
          `;

          container.appendChild(card);
          renderCapabilityTags(ac.device_id, currentProto);
        });

        attachCardHandlers();
      }

      function renderCapabilityTags(deviceId, proto) {
        const capsContainer = document.getElementById(`caps_${deviceId}`);
        if (!capsContainer || !CapabilityEngine) return;

        const caps = CapabilityEngine.getCapabilities(proto);
        capsContainer.innerHTML = '';

        // Row 1: Primary Parameters (Temperature range + Modes)
        const row1 = document.createElement('div');
        row1.className = 'flex items-center gap-1.5 flex-wrap w-full';

        // 1. Temp Range Tag
        const tempTag = document.createElement('span');
        tempTag.className = 'h-6 inline-flex items-center gap-1.5 px-2.5 rounded-lg font-mono font-bold text-[11px] bg-teal-50 dark:bg-teal-500/15 text-teal-800 dark:text-teal-300 border border-teal-200 dark:border-teal-500/30 whitespace-nowrap shadow-2xs shrink-0';
        tempTag.innerHTML = `
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" class="text-teal-600 dark:text-teal-400">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
          </svg>
          <span>${caps.min_temp}&deg;C &ndash; ${caps.max_temp}&deg;C</span>
        `;
        row1.appendChild(tempTag);

        // 2. Modes Tags
        if (Array.isArray(caps.modes)) {
          caps.modes.forEach(m => {
            const tag = document.createElement('span');
            tag.className = 'h-6 inline-flex items-center px-2 rounded-md font-bold text-[10px] tracking-wider uppercase bg-sky-50 dark:bg-sky-500/10 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-500/25 whitespace-nowrap shadow-2xs shrink-0';
            tag.textContent = m;
            row1.appendChild(tag);
          });
        }
        capsContainer.appendChild(row1);

        // Row 2: Features & Fan Speeds
        const row2 = document.createElement('div');
        row2.className = 'flex items-center gap-1.5 flex-wrap w-full mt-1.5';

        // 3. Feature Badges
        const featureList = [
          { key: 'turbo', label: 'Turbo' },
          { key: 'eco', label: 'Eco' },
          { key: 'swing', label: 'Swing' },
          { key: 'sleep', label: 'Sleep' },
          { key: 'timer', label: 'Timer' }
        ];

        featureList.forEach(f => {
          if (caps[f.key]) {
            const tag = document.createElement('span');
            tag.className = 'h-6 inline-flex items-center gap-1 px-2 rounded-md font-semibold text-[10px] bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/25 whitespace-nowrap shadow-2xs shrink-0';
            tag.innerHTML = `
              <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span>${f.label}</span>
            `;
            row2.appendChild(tag);
          }
        });

        // 4. Fan Speeds Tag
        if (Array.isArray(caps.fans) && caps.fans.length) {
          const fanTag = document.createElement('span');
          fanTag.className = 'h-6 inline-flex items-center gap-1.5 px-2.5 rounded-md font-medium text-[10px] bg-slate-100 dark:bg-white/5 text-slate-700 dark:text-gray-300 border border-slate-200 dark:border-white/10 whitespace-nowrap shadow-2xs shrink-0';
          fanTag.innerHTML = `
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-400">
              <path d="M12 12c2-2 2-5 0-7s-5 0-7 2 0 5 2 7"/>
              <path d="M12 12c2 2 5 2 7 0s0-5-2-7-5 0-7 2"/>
              <path d="M12 12c-2 2-2 5 0 7s5 0 7-2 0-5-2-7"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
            <span>Fan: ${caps.fans.map(f => f.charAt(0).toUpperCase() + f.slice(1)).join(', ')}</span>
          `;
          row2.appendChild(fanTag);
        }
        if (row2.children.length > 0) {
          capsContainer.appendChild(row2);
        }
      }

      function attachCardHandlers() {
        // 1. Dropdown change listener
        document.querySelectorAll('.protocol-dropdown').forEach(select => {
          select.addEventListener('change', (e) => {
            const deviceId = e.target.dataset.device;
            const newProto = e.target.value;
            renderCapabilityTags(deviceId, newProto);
          });
        });

        // 2. Auto-Detect button listener
        document.querySelectorAll('.btn-autodetect').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const button = e.currentTarget;
            const deviceId = button.dataset.device;
            const nodeId = button.dataset.node;
            const icon = button.querySelector('.sniff-icon');
            const spinner = button.querySelector('.sniff-spinner');
            const label = button.querySelector('.sniff-label');

            button.disabled = true;
            icon?.classList.add('hidden');
            spinner?.classList.remove('hidden');
            if (label) label.textContent = 'Listening on node...';

            try {
              const res = await ProtocolAdapter.sniffProtocol(nodeId);
              if (res && res.success && res.protocol) {
                const select = document.querySelector(`.protocol-dropdown[data-device="${deviceId}"]`);
                if (select) {
                  if (![...select.options].some(option => option.value === res.protocol)) {
                    const option = document.createElement('option');
                    option.value = res.protocol;
                    option.textContent = `Captured ${res.protocol}`;
                    select.appendChild(option);
                  }
                  select.value = res.protocol;
                  renderCapabilityTags(deviceId, res.protocol);
                }
                showToast(`Auto-detected: ${res.brand || res.protocol} protocol for ${deviceId}!`, 'success');
              } else {
                showToast(res?.message || 'No remote signal detected on node within listening window.', 'warning');
              }
            } catch (err) {
              showToast('Sniffer request encountered an error.', 'error');
            } finally {
              button.disabled = false;
              icon?.classList.remove('hidden');
              spinner?.classList.add('hidden');
              if (label) label.textContent = 'Auto-Detect via Remote';
            }
          });
        });

        // 3. Save Protocol button listener
        document.querySelectorAll('.btn-save-protocol').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const deviceId = e.currentTarget.dataset.device;
            const select = document.querySelector(`.protocol-dropdown[data-device="${deviceId}"]`);
            if (!select) return;

            const selectedProto = select.value;
            const aircon = AirconProfileManager.getById(deviceId);
            if (aircon) {
              const button = e.currentTarget;
              button.disabled = true;
              try {
                const saved = await AirconProfileManager.save({ ...aircon, protocol_name: selectedProto, protocol: selectedProto, capabilities: CapabilityEngine.getCapabilities(selectedProto) });
                showToast(`Protocol ${selectedProto} saved in Supabase for ${saved.name}.`, 'success');
              } catch (error) { showToast(error.message || 'Protocol was not saved.', 'error'); }
              finally { button.disabled = false; }
            }
          });
        });

        // 4. Test Intent button listener
        document.querySelectorAll('.btn-test-intent').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const deviceId = e.currentTarget.dataset.device;
            const aircon = AirconProfileManager.getById(deviceId);
            if (!aircon) return;

            const select = document.querySelector(`.protocol-dropdown[data-device="${deviceId}"]`);
            if (select && select.value) {
              aircon.protocol_name = select.value;
              aircon.protocol = select.value;
            }

            const res = await CommandManager.dispatch({
              device_id: deviceId,
              protocol: select?.value || aircon.protocol_name,
              command: 'TEMP',
              value: 24
            });

            if (res && res.success) {
              showToast(`Intent dispatched to ${aircon.node_id}: {"protocol": "${res.intent?.protocol}", "state": ${JSON.stringify(res.intent?.state)}}`, 'success');
            } else {
              showToast(res?.message || 'Failed to dispatch command intent.', 'error');
            }
          });
        });
      }

      // Live event sync across modules and storage
      window.addEventListener('devices:synced', renderProfiles);
      window.addEventListener('aircon:updated', renderProfiles);
      if (AirconEvents) {
        AirconEvents.on('devices:synced', renderProfiles);
        AirconEvents.on('aircon:updated', renderProfiles);
        AirconEvents.on('aircon:saved', renderProfiles);
        AirconEvents.on('aircon:deleted', renderProfiles);
        AirconEvents.on('aircons:synced', renderProfiles);
      }

      if (window.EcoDataBus) {
        window.EcoDataBus.on('aircons:synced', renderProfiles);
        window.EcoDataBus.on('devices:synced', renderProfiles);
      }

      renderProfiles();
    });
  </script>
</body>
</html>
